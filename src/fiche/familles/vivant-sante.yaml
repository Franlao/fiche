id: vivant-sante
version: 2
nom: Vivant et santé
filieres: [biologie, médecine, pharmacie, soins infirmiers, sciences de la vie]
pour_etudiant: >
  Les mécanismes en étapes numérotées, les classifications en tableaux, les chiffres et les
  seuils à part, les arbres de décision quand le cours distingue des cas. À la fin de chaque
  chapitre, ce qu'il faut savoir redire à l'oral.
ton: >
  Direct et concret. Les termes exacts du cours (nom de la molécule, de la structure, du
  signe clinique), jamais de synonyme approximatif. Les quantités avec leur unité.
voix: >
  Écris comme on explique un mécanisme à l'oral, au tableau : qui agit, sur quoi, avec quel
  effet. Chaque étape nomme un acteur et un verbe d'action (se fixe, libère, ouvre, phosphoryle),
  jamais « intervient » ou « joue un rôle ». Les chiffres restent ceux du cours, avec leur
  unité. Pas de connaissance médicale extérieure, même évidente.
blocs:
  - type: etapes
    usage: >
      Tout mécanisme, voie, cascade, cycle ou protocole : une étape par ligne, dans l'ordre, avec
      ce qui déclenche et ce qui résulte.
  - type: tableau
    usage: >
      Classifications et comparaisons : types de transport, familles de récepteurs, signes d'une
      pathologie, concentrations, doses et seuils. Une ligne par élément.
  - type: definition
    usage: Chaque structure, molécule ou terme que la section introduit.
  - type: encadre
    usage: >
      Une loi, une règle ou un chiffre isolé à connaître par cœur. Plusieurs chiffres à comparer
      vont dans un tableau.
  - type: decision
    usage: >
      Quand le cours distingue des cas ou des conduites : « si cette situation, alors cette
      réponse ».
  - type: piege
    usage: >
      Deux éléments proches du cours que l'on confond (deux transports, deux récepteurs, deux
      signes). Seulement si les deux sont dans les extraits.
  - type: essentiel
    usage: >
      À la fin du chapitre : ce qu'il faut savoir redire à l'oral, en phrases complètes.
  - type: autotest
    usage: >
      À la fin du chapitre : 2 à 4 questions courtes dont la réponse est dans le chapitre.
  - type: texte
    usage: Rare. Le rôle d'ensemble d'une structure, quand aucune autre forme ne convient.
ordre: [texte, definition, etapes, tableau, encadre, decision, piege, essentiel, autotest]
fin_de_chapitre: [essentiel, autotest]
max_blocs_par_section: 7
max_texte_par_section: 1
plan: >
  Fais voir la logique structure, fonction, régulation : quelles structures le cours décrit,
  quels mécanismes elles permettent, ce qui les régule ou les dérègle. Pour chaque section, dis
  quel mécanisme va en étapes, quelle classification va en tableau. Le fil conducteur relie les
  mécanismes entre eux : ce qui en amont déclenche quoi.
redaction: >
  Chaque étape d'un mécanisme nomme l'acteur et l'effet. Les cellules de tableau sont courtes.
  Préfère des étapes à un texte, un tableau à une énumération.
