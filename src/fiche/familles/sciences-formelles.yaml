id: sciences-formelles
version: 1
nom: Sciences formelles
filieres: [mathématiques, physique, mécanique, informatique théorique, statistiques]
pour_etudiant: >
  Les définitions d'abord, puis les théorèmes, propriétés et formules dans des encadrés avec
  leurs hypothèses. Un exemple résolu quand le cours en donne un, les erreurs classiques, et un
  formulaire à relire la veille.
ton: >
  Précis et sobre. Les notations du cours, jamais d'autres. Une formule s'écrit en LaTeX entre
  $ $. Pas d'adjectifs, pas de « il est important de ».
blocs:
  - type: definition
    usage: Chaque objet ou terme que la section introduit, avec sa notation. Une définition par terme.
  - type: encadre
    usage: >
      Tout résultat à savoir par cœur : théorème, proposition, propriété, formule, loi. Les
      hypothèses dans « conditions », le sens de chaque symbole dans « variables », l'idée de la
      preuve ou l'usage dans « idee » si le cours le dit.
  - type: tableau
    usage: >
      Quand la section compare ou liste des cas (dérivées usuelles, lois, types de forces,
      conditions d'équilibre) : une ligne par cas, une colonne par critère.
  - type: etapes
    usage: Une méthode de résolution ou un raisonnement que le cours déroule dans l'ordre.
  - type: exemple
    usage: Un exemple ou exercice que le cours résout, avec ses étapes et ce qu'il illustre.
  - type: piege
    usage: >
      Confusions entre deux résultats du cours (hypothèse oubliée, sens d'une inégalité, signe,
      cas particulier pris pour le cas général). Seulement si les deux côtés sont dans le cours.
  - type: essentiel
    usage: En fin de section, ce qu'il faut savoir redire sans la fiche, en 3 à 6 lignes.
  - type: autotest
    usage: 2 ou 3 questions courtes dont la réponse est dans la section.
  - type: texte
    usage: Rare. Une transition ou une idée directrice qui n'est ni une définition ni un résultat.
ordre: [texte, definition, encadre, tableau, etapes, exemple, piege, essentiel, autotest]
max_blocs_par_section: 8
max_texte_par_section: 1
plan: >
  Fais voir l'architecture logique du cours : quels objets sont définis, quels résultats
  en découlent, lesquels servent aux suivants. Pour chaque section, dis quels résultats vont
  dans des encadrés et ce qui mérite un tableau. Repère les sections qui ne font que calculer
  (exemples) et celles qui posent la théorie. Le fil conducteur dit à l'étudiant quoi maîtriser
  avant quoi.
redaction: >
  Les énoncés sont exacts et complets : un théorème sans ses hypothèses est faux. Garde les
  notations du cours. Préfère un encadré à un texte, un tableau à une liste de phrases. Les
  réponses de l'autotest se trouvent dans les extraits. N'invente ni exemple ni contre-exemple.
