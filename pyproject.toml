[project]
name = "fiche"
version = "0.2.0"
description = "Module fiche de révision pour wiliyu : d'un cours structuré par ingest à une fiche en blocs typés, selon un gabarit de filière."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic-ai-slim[anthropic,mistral,openai]>=2.66.0",
]

[project.scripts]
fiche = "fiche.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]
ignore = ["B008", "E501"]
allowed-confusables = ["–", "—", "×", "’"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/fiche"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["fiche"]
omit = ["src/fiche/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
